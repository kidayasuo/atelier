<!-- 航空ベニヤ 0.6 300×600：西館の1階の間仕切り（番号は 10w_西館の室内の壁の配置図 と同じ。足は番号に A・B）。高さは床の上面から。半欠きは切り込み（上から／下から）。切り幅は0.20と仮定（T5 の結果が mokei.json に入るまで）。向きは元のまま、外接矩形が最小になるように詰めた（壁どうし2.5 mm以上）。使う大きさ313.7×34.7 mm（板の左上から、マージン3込み。端材からこの大きさを切り出して使う） -->
